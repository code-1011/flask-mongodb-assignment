<!DOCTYPE html>
<html>
<head>
    <title>Student Form</title>
</head>
<body>

<h1>Submit Student Data</h1>

{% if error %}
<p style="color: red;">{{ error }}</p>
{% endif %}

<form method="POST">

    <label>Name:</label>
    <input type="text" name="name" required>

    <br><br>

    <label>Grade:</label>
    <input type="text" name="grade" required>

    <br><br>

    <button type="submit">Submit</button>

</form>

</body>
</html>
